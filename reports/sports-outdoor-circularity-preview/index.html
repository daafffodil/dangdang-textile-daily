  <style>
    :root {
      --ink: #171a18;
      --muted: #686d68;
      --line: #e2e5e0;
      --paper: #ffffff;
      --accent: #23b985;
      --green: #dff3e7;
      --yellow: #fff0b8;
      --violet: #e9e5fa;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    .page {
      width: min(calc(100% - 48px), 1180px);
      margin: 0 auto;
      padding-bottom: 52px;
    }

    header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -.02em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .directory-link {
      min-height: 36px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
    }

    .directory-link:hover { border-color: #aeb5ae; }

    main { padding-top: 34px; }

    .collection-head {
      margin-bottom: 28px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 48px);
      line-height: 1.08;
      letter-spacing: -1.8px;
    }

    .count {
      flex: 0 0 auto;
      padding-bottom: 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    .column {
      min-width: 0;
      display: grid;
      gap: 16px;
    }

    details {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 21px;
      background: #fff;
    }

    details[data-tone="green"] { background: var(--green); }
    details[data-tone="yellow"] { background: var(--yellow); }
    details[data-tone="violet"] { background: var(--violet); }

    summary {
      min-height: 148px;
      padding: 20px 21px;
      display: flex;
      flex-direction: column;
      list-style: none;
      cursor: pointer;
      user-select: none;
    }

    summary::-webkit-details-marker { display: none; }

    .label {
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .card-title {
      margin: 0;
      padding-right: 18px;
      font-size: 20px;
      line-height: 1.36;
      letter-spacing: -.6px;
    }

    .toggle {
      margin-top: auto;
      align-self: flex-end;
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
    }

    .toggle::before { content: "＋"; }
    details[open] .toggle::before { content: "－"; }
    details[open] summary { min-height: auto; padding-bottom: 18px; }

    .content {
      margin: 0 21px;
      padding: 18px 0 22px;
      border-top: 1px solid rgba(52, 58, 53, .14);
      color: #424742;
      font-size: 13px;
      line-height: 1.78;
    }

    .field { margin: 0 0 15px; }
    .field:last-child { margin-bottom: 0; }

    .field dt {
      margin: 0 0 3px;
      color: var(--ink);
      font-weight: 700;
    }

    .field dd { margin: 0; }

    .source {
      color: #087278;
      font-weight: 700;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }

    summary:focus-visible,
    a:focus-visible {
      outline: 2px solid #68bea0;
      outline-offset: 2px;
    }

    @media (max-width: 920px) {
      .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 680px) {
      .page {
        width: min(calc(100% - 24px), 1180px);
        padding-bottom: 32px;
      }

      header { height: 72px; }
      .brand { font-size: 16px; }
      .brand-mark { width: 34px; height: 34px; }
      main { padding-top: 24px; }

      .collection-head {
        margin-bottom: 20px;
        align-items: start;
        flex-direction: column;
        gap: 8px;
      }

      h1 {
        font-size: 34px;
        letter-spacing: -1.3px;
      }

      .count { padding: 0; }
      .board { grid-template-columns: 1fr; }
      summary { min-height: 124px; padding: 18px; }
      .card-title { font-size: 19px; }
      .content { margin: 0 18px; }
    }
  </style>

        current: "2024 年报告继续将 WearAgains 列入循环业务；2026 年消费者入口需以品牌当期页面为准。",
        partners: "当前公开资料未充分披露。",
        china: "未开放。",
        source: "https://www.peakperformance.com/",
        tone: "yellow"
      },
      {
        brand: "李宁",
        project: "旧物循绿，自然新生",
        entry: "线上平台、12 家门店和快闪活动。",
        region: "中国。",
        current: "截至 2025 年底累计回收超过 2,700 千克；2026 年发布的年报继续披露项目成果。",
        partners: "专业回收平台；年报未公开名称。",
        china: "可参与，具体门店和活动时间需查询当期公告。",
        source: "https://ir.lining.com/sc/csr/csr.php",
        tone: "green"
      },
      {
        brand: "AIGLE",
        project: "中国旧衣回收 / 日本 BRING",
        entry: "中国阶段性活动入口与门店；日本通过参与门店回收。",
        region: "中国和日本。",
        current: "中国项目在 2025 年曾开展，2026 年续期需向品牌确认；日本官网仍介绍 BRING。",
        partners: "中国飞蚂蚁；日本 JEPLAN / BRING。",
        china: "2025 年存在活动，2026 年需查询品牌当期公告。",
        source: "https://www.aigle.co.jp/topics/article/101",
        tone: ""
      }
    ];

    const board = document.querySelector("#board");
    const projectCount = document.querySelector("#projectCount");
    let columnCount = 0;

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function getColumnCount() {
      if (window.innerWidth <= 680) return 1;
      if (window.innerWidth <= 920) return 2;
      return 3;
    }

    function cardHtml(item) {
      const tone = item.tone ? ` data-tone="${item.tone}"` : "";
      return `
        <details${tone}>
          <summary>
            <span class="label">${escapeHtml(item.brand)}</span>
            <h2 class="card-title">${escapeHtml(item.project)}</h2>
            <span class="toggle" aria-hidden="true"></span>
          </summary>
          <div class="content">
            <dl>
              <div class="field"><dt>参与入口</dt><dd>${escapeHtml(item.entry)}</dd></div>
              <div class="field"><dt>开展地区</dt><dd>${escapeHtml(item.region)}</dd></div>
              <div class="field"><dt>2026 年情况</dt><dd>${escapeHtml(item.current)}</dd></div>
              <div class="field"><dt>公开合作方</dt><dd>${escapeHtml(item.partners)}</dd></div>
              <div class="field"><dt>中国大陆入口</dt><dd>${escapeHtml(item.china)}</dd></div>
              <div class="field"><dt>公开页面</dt><dd><a class="source" href="${escapeHtml(item.source)}" target="_blank" rel="noreferrer">查看项目来源 ↗</a></dd></div>
            </dl>
          </div>
        </details>`;
    }

    function render() {
      const nextColumnCount = getColumnCount();
      if (nextColumnCount === columnCount) return;
      columnCount = nextColumnCount;
      const columns = Array.from({ length: columnCount }, () => []);
      projects.forEach((project, index) => {
        columns[index % columnCount].push(cardHtml(project));
      });
      board.innerHTML = columns
        .map((cards) => `<div class="column">${cards.join("")}</div>`)
        .join("");
    }

    projectCount.textContent = `${projects.length} 个公开项目`;
    render();
    window.addEventListener("resize", render, { passive: true });
  </script>
</body>
</html>
