<!doctype html>

<head>

<style>
:root{--ink:#111310;--paper:#f2f1eb;--soft:#e6e5de;--line:#b9bbb3;--green:#a4ff72;--brand:#16b978;--deep:#087278}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;line-height:1.68;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:4px}
.shell{width:min(100% - 48px,1180px);margin:0 auto}
.topbar{border-bottom:1px solid var(--ink)}
.topbar-inner{height:78px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px;color:var(--ink);font-size:15px;font-weight:760;letter-spacing:-.02em;text-decoration:none}
.brand-mark{width:31px;height:31px;border:6px solid var(--brand);border-left-color:var(--green);border-bottom-color:var(--deep);border-radius:50%}
.top-action{color:var(--ink);font-size:12px;font-weight:760;letter-spacing:.12em;text-decoration:none}
.hero{min-height:68vh;padding:58px 0 24px;display:flex;flex-direction:column;justify-content:space-between}
.hero-kicker{margin:0;font-size:12px;font-weight:760;letter-spacing:.14em}
h1{max-width:none;margin:18px 0 0;font-size:clamp(66px,12vw,148px);font-weight:760;line-height:.86;letter-spacing:-.085em}
.hero-meta{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding-top:15px;border-top:1px solid var(--ink);font-size:12px;font-weight:680}
.hero-meta span:last-child{text-align:right}
.reports{padding-bottom:92px}
.section-label{padding:14px 0;border-top:1px solid var(--ink);font-size:12px;font-weight:760;letter-spacing:.13em}
.report-row{display:grid;grid-template-columns:180px minmax(0,1fr) 40px;gap:26px;align-items:start;padding:28px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;transition:background-color .18s ease}
.report-row:last-child{border-bottom:1px solid var(--ink)}
.report-row:hover{background:var(--green)}
.report-row-featured{background:var(--green)}
.row-date{display:flex;flex-direction:column;gap:7px}
.row-date small{font-size:11px;font-weight:800;letter-spacing:.14em}
.row-date time{font-size:15px;font-weight:760}
.row-main h2{max-width:850px;margin:0;font-size:clamp(26px,3.5vw,47px);font-weight:720;line-height:1.04;letter-spacing:-.045em}
.arrow{font-size:28px;line-height:1;text-align:right}
.article-hero{min-height:54vh;padding:38px 0 24px;display:flex;flex-direction:column;justify-content:space-between}
.back{width:max-content;font-size:12px;font-weight:760;letter-spacing:.12em;text-decoration:none}
.article-heading{display:grid;grid-template-columns:180px minmax(0,1fr);gap:26px;align-items:end}
.article-date{padding-bottom:9px;font-size:13px;font-weight:760;letter-spacing:.08em}
.article-hero h1{font-size:clamp(57px,9vw,112px)}
article{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;margin-bottom:92px;border-top:1px solid var(--ink)}
article>h2{grid-column:1/-1;margin:74px 0 30px;padding-top:14px;border-top:1px solid var(--ink);font-size:clamp(36px,5vw,62px);font-weight:720;line-height:1.02;letter-spacing:-.055em}
article>h2:first-child{margin-top:0;border-top:0}
article>h3{grid-column:3/11;margin:48px 0 14px;font-size:clamp(23px,2.7vw,34px);font-weight:720;line-height:1.14;letter-spacing:-.035em}
article>h4{grid-column:3/11;margin:34px 0 10px;font-size:19px}
article>p,article>ul,article>ol{grid-column:3/11}
article>p{margin:0 0 18px;font-size:17px;color:#30332f}
article>ul,article>ol{margin:0 0 24px;padding-left:1.35em}
article>li{margin:0 0 10px;padding-left:.2em}
article li::marker{color:var(--brand);font-weight:900}
article strong{color:var(--ink)}
article a{color:var(--deep);overflow-wrap:anywhere;font-weight:680}
.table-wrap{grid-column:1/-1;margin:20px 0 34px;overflow-x:auto;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:15px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{font-weight:760}
tr:last-child td{border-bottom:0}
code{padding:1px 4px;background:var(--soft)}
.footer{padding:20px 0 34px;border-top:1px solid var(--ink);font-size:11px;font-weight:700;letter-spacing:.1em}
@media(max-width:720px){
  .shell{width:min(100% - 24px,1180px)}
  .topbar-inner{height:64px}
  .hero{min-height:60vh;padding-top:36px}
  h1{font-size:clamp(58px,18vw,92px)}
  .hero-meta{grid-template-columns:repeat(4,1fr)}
  .hero-meta span:last-child{display:none}
  .report-row{grid-template-columns:1fr 28px;gap:14px;padding:22px 0}
  .row-date{grid-column:1/-1;display:grid;grid-template-columns:52px 1fr;gap:8px}
  .row-main{grid-column:1}
  .arrow{grid-column:2}
  .article-hero{min-height:43vh}
  .article-heading{display:block}
  .article-date{margin-bottom:12px}
  .article-hero h1{font-size:clamp(50px,16vw,84px)}
  article{column-gap:0}
  article>h2,article>h3,article>h4,article>p,article>ul,article>ol{grid-column:1/-1}
  article>h2{margin-top:56px;font-size:36px}
  article>h3{margin-top:38px;font-size:25px}
  article>p{font-size:16px}
}
</style>
</head>
