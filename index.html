<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="铛铛一下项目目录：从一个首页进入旧衣回收行业日报、品牌回收项目、灵感墙与内容趋势站点。">
  <meta name="theme-color" content="#f7f6f2">
    <title>旧衣回收</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d211d;
      --line: rgba(28, 34, 28, .12);
      --paper: #fff;
      --green: #e8efe4;
      --yellow: #f3edcf;
      --violet: #ece7f2;
      --blue: #e4edf0;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      min-height: 100vh;
    }

    a { color: inherit; }

    .page {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .site-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 0 36px;
    }

    .site-header img {
      width: 28px;
      height: 28px;
      display: block;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.3;
    }

    .projects {
      column-count: 3;
      column-gap: 18px;
    }

    .project {
      padding: 24px;
      display: flex;
      flex-direction: column;
      break-inside: avoid;
      margin: 0 0 18px;
      text-decoration: none;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      transition: transform .2s ease, border-color .2s ease;
    }

    .project:hover,
    .project:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(28, 34, 28, .22);
      outline: none;
    }

    .project--green { background: var(--green); }
    .project--yellow { background: var(--yellow); }
    .project--violet { background: var(--violet); }
    .project--blue { background: var(--blue); }

    .project-meta {
      color: rgba(29, 33, 29, .58);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .12em;
    }

    .project h2 {
      margin: 46px 0 4px;
      max-width: 10em;
      font-size: clamp(25px, 2.4vw, 34px);
      font-weight: 700;
      letter-spacing: -.035em;
      line-height: 1.16;
    }

    @media (max-width: 920px) {
      .projects { column-count: 2; }
    }

    @media (max-width: 620px) {
      .page {
        width: min(100% - 28px, 520px);
        padding-top: 20px;
      }

      .site-header { padding-bottom: 28px; }
      .projects { column-count: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .project { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <img src="https://daafffodil.github.io/dangdang-textile-daily/brand-mark.png" alt="">
        <h1>旧衣回收</h1>
    </header>

    <main>
      <section class="projects" aria-label="项目列表">
        <a class="project project--green" href="https://daafffodil.github.io/dangdang-textile-daily/2026-08-04/" aria-label="进入旧衣回收行业日报">
          <div class="project-meta">行业日报</div>
          <h2>旧衣回收行业日报</h2>
        </a>

        <a class="project project--yellow" href="https://daafffodil.github.io/dangdang-textile-daily/reports/sports-outdoor-circularity-preview/" aria-label="进入运动户外品牌回收项目">
          <div class="project-meta">品牌项目</div>
          <h2>运动户外品牌回收项目</h2>
        </a>

        <a class="project project--violet" href="https://daafffodil.github.io/dangdang-inspiration-wall/" aria-label="进入旧衣回收灵感墙">
          <div class="project-meta">视觉灵感</div>
          <h2>旧衣回收灵感墙</h2>
        </a>

        <a class="project project--blue" href="https://daafffodil.github.io/xiaohongshu-vertical-trend-monitor/" aria-label="进入小红书旧衣回收垂直趋势">
          <div class="project-meta">内容趋势</div>
          <h2>小红书旧衣回收垂直趋势</h2>
        </a>
      </section>
    </main>
  </div>
</body>
</html>
